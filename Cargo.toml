[workspace]
resolver = "3"
members = ["crates/*", "plugins/palette/*", "plugins/widgets/*"]
# A bare `cargo build`, `cargo test` or `cargo run` at the root means derisk
# itself and the shell crates its binary is made of, as it did when derisk
# was the root package. The apps, the portal and the GPUI runtime are built
# by name (`-p`) or with `--workspace`.
default-members = [
    "crates/derisk",
    "crates/derisk-desktop",
    "crates/derisk-geom",
    "crates/derisk-install",
    "crates/derisk-login",
    "crates/derisk-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
repository = "https://github.com/dasmatus/derisk"

[workspace.dependencies]
# Every mcsapi crate comes from the same mcsapi revision so the apps and the
# compositor share one mcsapi-ui; `cargo update -p mcsapi` moves them together.
mcsapi = { git = "https://github.com/dasmatus/mcsapi" }
mcsapi-ui = { git = "https://github.com/dasmatus/mcsapi" }
mcsapi-runtime = { git = "https://github.com/dasmatus/mcsapi" }
mcsapi-theme = { git = "https://github.com/dasmatus/mcsapi" }
mcsapi-components = { git = "https://github.com/dasmatus/mcsapi" }
mcsapi-components-gpui = { git = "https://github.com/dasmatus/mcsapi" }
mcsapi-compositor = { git = "https://github.com/dasmatus/mcsapi" }
mcsapi-hardened-malloc = { git = "https://github.com/dasmatus/mcsapi" }
derisk-desktop = { path = "crates/derisk-desktop", version = "0.1.0" }
derisk-geom = { path = "crates/derisk-geom", version = "0.1.0" }
derisk-frame = { path = "crates/derisk-frame", version = "0.1.0" }
derisk-install = { path = "crates/derisk-install", version = "0.1.0" }
derisk-login = { path = "crates/derisk-login", version = "0.1.0" }
derisk-settings = { path = "crates/derisk-settings", version = "0.1.0" }
derisk-files = { path = "crates/derisk-files", version = "0.1.0" }
derisk-index = { path = "crates/derisk-index", version = "0.1.0", default-features = false }
derisk-editor = { path = "crates/derisk-editor", version = "0.1.0" }
derisk-monitor = { path = "crates/derisk-monitor", version = "0.1.0" }
derisk-calculator = { path = "crates/derisk-calculator", version = "0.1.0" }
derisk-apps = { path = "crates/derisk-apps", version = "0.1.0" }
derisk-icons = { path = "crates/derisk-icons", version = "0.1.0" }
derisk-sys = { path = "crates/derisk-sys", version = "0.1.0" }
derisk-gpui = { path = "crates/derisk-gpui", version = "0.1.0" }
derisk-machines = { path = "crates/derisk-machines", version = "0.1.0" }
derisk-terminal = { path = "crates/derisk-terminal", version = "0.1.0" }
derisk-store = { path = "crates/derisk-store", version = "0.1.0" }
derisk-android = { path = "crates/derisk-android", version = "0.1.0" }
# The GPUI mcsapi-components-gpui is built on (Zed's, at the revision mcsapi
# pins): two GPUIs in one build cannot share a window or an element.
gpui = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a", features = ["font-kit", "wayland", "x11"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Diagnostics go out as `tracing` events; only the binaries install a
# subscriber, so a library never decides where its logs land.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# `derisk` logs straight to journald with structured fields when it runs
# under systemd.
tracing-journald = "0.3.2"
# Errors that reach a person are miette reports. Libraries take it without
# `fancy`; each binary turns `fancy` on for the graphical report.
miette = "7.6.0"
thiserror = "2"
derisk-plugin = { path = "crates/derisk-plugin", version = "0.1.0" }
# Scoped threads hand their results back over bounded channels.
crossbeam-channel = "0.5.15"
# The plugin host for the palette and the overview, built the way pm hosts
# its plugins (losos-project/pm, `src/plugin/engine.rs`): the component
# model and Cranelift, nothing else. No WASI is compiled in to be linked by mistake.
wasmtime = { version = "49.0.0", default-features = false, features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }
# Wraps the plugins' core modules in components, in derisk-plugin's build
# script.
wit-component = "0.262.0"
# The plugins' side of the WIT, in plugins/palette/sdk and
# plugins/widgets/sdk.
wit-bindgen = { version = "0.63.0", default-features = false, features = ["macros", "realloc"] }
# Signatures on plugins a person installs: pm's detached ed25519 `.sig`
# format and trust store, so `pm sign` signs a derisk plugin too.
pm-signing = { git = "https://github.com/losos-project/pm" }

# One codegen unit and fat LTO across every crate, mcsapi included: release
# builds are the ones that ship, so they trade build time for inlining across
# crate boundaries and a smaller binary. CI tests in the dev profile.
[profile.release]
lto = true
codegen-units = 1

# Cranelift compiles the palette's and the overview's plugins when they
# first open. Unoptimised that takes seconds, which every test that opens
# either would pay, as pm found for its own plugins; optimised it is a
# fraction of one. Only the
# compiler is optimised, so derisk's own code stays as debuggable.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.gimli]
opt-level = 3

# The plugins under plugins/, as derisk-plugin's build script compiles them
# to WebAssembly. Cranelift compiles every one of them as the session
# starts, so their size is latency: `z` roughly halves it, and a plugin that
# panics only has to trap. What a call costs is copying the view in and the
# rows out, which no opt-level changes.
[profile.wasm-plugin]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = true

# mcsapi at the revision Cargo.lock pins takes GPUI from Sonne, which is no
# longer public, so nothing can fetch it there. This sends those crates to
# upstream Zed at the commit Sonne's fork sat on, the same GPUI the
# workspace uses above. It can go once the pin moves to an mcsapi that takes
# GPUI from Zed itself (losos-project/mcsapi#66).
[patch."https://github.com/dasmatus/sonne"]
# Zed has a second package named gpui, a 0.0.0 stand-in, so name the version.
gpui = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a", version = "=0.2.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a" }
collections = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a" }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a" }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a" }
refineable = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a" }
syntax_theme = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a" }
