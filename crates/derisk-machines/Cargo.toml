[package]
name = "derisk-machines"
description = "The machines pm creates, as derisk shows and drives them, and the Machines app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# pm's record of a machine, machine.json, and the guest agent's replies.
serde_json.workspace = true
thiserror.workspace = true
miette.workspace = true
# The Machines app.
derisk-frame.workspace = true
derisk-icons.workspace = true
derisk-sys.workspace = true
mcsapi-components.workspace = true
mcsapi-ui.workspace = true
# Which machine apps open in by default is a desktop setting, which the
# Machines app sets and the session reads.
derisk-settings.workspace = true

# Machines run only on Linux hosts; the browser demo of the core apps
# builds this crate for wasm32 with the parsing and the labels alone.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossbeam-channel.workspace = true
# guest-exec hands a program's captured output back base64-encoded.
base64 = "0.22.1"
tracing.workspace = true
# The desktop's end of a guest's windows: AF_VSOCK, which std has no type for.
vsock = "0.5.4"
