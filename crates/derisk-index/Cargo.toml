[package]
name = "derisk-index"
description = "derisk's file index: names and text of the files under home, kept current by a user service the command palette searches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "derisk-index"
required-features = ["service"]

[dependencies]
serde.workspace = true
serde_json.workspace = true

# Only the service: the session links the client above, not a search engine.
crossbeam-channel = { workspace = true, optional = true }
# The index itself: an inverted index on disk, searched by BM25.
tantivy = { version = "0.27.0", optional = true, default-features = false, features = ["mmap", "lz4-compression"] }
# The walk: hidden entries, `.gitignore`, `.ignore` and git's excludes
# skipped the way ripgrep skips them.
ignore = { version = "0.4.33", optional = true }
# The XML inside OpenDocument and Office Open XML files, which are ZIPs
# whose parts are deflated.
flate2 = { version = "1.1.10", optional = true }
# What changed, straight from the kernel.
inotify = { version = "0.11.5", default-features = false, optional = true }
miette = { workspace = true, optional = true, features = ["fancy"] }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
# The service is what this package is built for on its own; the session
# depends on it without default features, for the client alone.
default = ["service"]
service = [
    "dep:crossbeam-channel",
    "dep:flate2",
    "dep:ignore",
    "dep:inotify",
    "dep:miette",
    "dep:tantivy",
    "dep:tracing",
    "dep:thiserror",
    "dep:tracing-subscriber",
]
