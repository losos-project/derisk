[package]
name = "derisk-web"
description = "The derisk core apps in a browser, on derisk-sys's demo system, for showing them off"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The cdylib is what wasm-bindgen turns into the page's module
# (scripts/build-web.sh); rlib keeps `cargo test --workspace` linking it.
crate-type = ["cdylib", "rlib"]

# Everything is browser-only: on Linux this crate is empty, so the
# workspace's native clippy and tests build it without a web toolchain.
[target.'cfg(target_family = "wasm")'.dependencies]
derisk-apps.workspace = true
derisk-editor.workspace = true
derisk-files.workspace = true
derisk-settings.workspace = true
derisk-sys.workspace = true
mcsapi-runtime.workspace = true
mcsapi-ui.workspace = true
eframe.workspace = true
# eframe's web runner logs through `log`; the page sends it to the console.
log = "0.4.34"
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }
