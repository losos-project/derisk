[package]
name = "derisk-files"
description = "derisk Files app: a file manager with places, clipboard, and freedesktop trash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
derisk-frame.workspace = true
derisk-icons.workspace = true
derisk-sys.workspace = true
mcsapi-components.workspace = true
mcsapi-ui.workspace = true

# Only for the O_NOFOLLOW and O_DIRECTORY values, which differ by
# architecture. A browser build copies without them (fs_ops::copy_into).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
