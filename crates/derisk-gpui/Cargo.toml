[package]
name = "derisk-gpui"
description = "The derisk core apps as GPUI windows, each its own Wayland client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
derisk-calculator.workspace = true
derisk-settings.workspace = true
mcsapi-theme.workspace = true
gpui = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }
# The picker reads the color under the pointer from the screenshot.
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
mcsapi-components-gpui = { workspace = true, optional = true }
mcsapi-ui.workspace = true
tracing.workspace = true
# Only the `derisk-gpui` binary installs a subscriber and prints reports.
tracing-subscriber = { workspace = true, optional = true }
miette = { workspace = true, features = ["fancy"], optional = true }
thiserror = { workspace = true, optional = true }

[features]
# GPUI needs Wayland, X11 and Vulkan system libraries; off by default like
# mcsapi's own `gpui` feature, so the workspace builds without them.
gpui = [
    "dep:gpui",
    "dep:image",
    "dep:gpui_platform",
    "dep:mcsapi-components-gpui",
    "mcsapi-components-gpui/gpui",
    "dep:miette",
    "dep:thiserror",
    "dep:tracing-subscriber",
]

[[bin]]
name = "derisk-gpui"
required-features = ["gpui"]
