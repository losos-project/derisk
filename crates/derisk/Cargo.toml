[package]
name = "derisk"
description = "An adaptive, agent-first Wayland desktop shell built on mcsapi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
derisk-desktop.workspace = true
derisk-geom.workspace = true
derisk-install.workspace = true
derisk-login.workspace = true
# The labels of the virtual machines windows come from, and on the host the
# sockets and gate that bring their windows here.
derisk-machines.workspace = true
# The palette's plugin host; every palette row comes from a plugin.
derisk-plugin.workspace = true
# The client of the file index the palette searches files' text in; the
# index itself is derisk-index's own service.
derisk-index.workspace = true
derisk-icons.workspace = true
derisk-settings.workspace = true
mcsapi.workspace = true
# Buttons, fields and alerts for the installer and first-boot setup.
mcsapi-components.workspace = true
# The installer's sign-in code for reporting a failed install, as a QR code
# for a phone, drawn by derisk-settings' own.
qrcode = { version = "0.14", default-features = false }
# Wallpapers in the formats the Settings app offers.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
mcsapi-theme.workspace = true
mcsapi-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The binary's subscriber: journald with structured fields under systemd,
# stderr otherwise.
tracing-journald.workspace = true
tracing-subscriber.workspace = true
# The library's errors are diagnostics; `fancy` is for the binary, which
# shares this package and prints them.
miette = { workspace = true, features = ["fancy"] }

# `derisk session` runs on mcsapi-compositor with the derisk core apps. Off by
# default so the shell library and headless commands build without graphics.
derisk-apps = { workspace = true, optional = true }
mcsapi-compositor = { workspace = true, optional = true }
mcsapi-runtime = { workspace = true, optional = true }
# Only its list of ported apps; the GPUI build is its own binary.
derisk-gpui = { workspace = true, optional = true }
# The lock screen's PAM conversation allocates with libc, which PAM frees.
libc = { version = "0.2", optional = true }
# The polkit agent: polkitd calls it on the system bus, on a thread of its
# own with a small tokio runtime. zbus runs on tokio here, as it does in
# derisk-portal through ashpd, so the workspace builds it one way.
tokio = { version = "1.43", optional = true, features = ["rt", "net", "io-util", "sync", "macros"] }
zbus = { version = "5.19", optional = true, default-features = false, features = ["tokio"] }
# Machines' lists come from a watching thread over a bounded channel.
crossbeam-channel = { workspace = true, optional = true }
# Ask derisk's language model, on an Ollama-compatible server: blocking,
# which suits the thread that asks, with rustls for a server over https.
ureq = { version = "3.4.2", optional = true }
# Screenshots for agents (`{"method":"screenshot"}`).
png = { version = "0.18.1", optional = true }
# Blacks out the secrets in every screenshot before it is encoded: OCR,
# patterns and the accessibility tree's password fields.
derisk-redact = { workspace = true, optional = true }
# GrapheneOS's hardened_malloc as the allocator (`hardened-malloc`). Links the
# system's libhardened_malloc.so, so it is off by default: a build host
# without that library can still build derisk.
mcsapi-hardened-malloc = { workspace = true, optional = true }

[features]
host = [
    "dep:derisk-apps",
    "dep:derisk-gpui",
    "dep:libc",
    "dep:mcsapi-compositor",
    # The display manager starts the login screen and the session on the
    # bare seat, with no compositor underneath to nest in.
    "mcsapi-compositor/kms",
    "dep:mcsapi-runtime",
    "dep:png",
    "dep:derisk-redact",
    "dep:tokio",
    "dep:zbus",
    "dep:crossbeam-channel",
    "dep:ureq",
]
# Make hardened_malloc derisk's allocator, for the Rust heap and every C
# library in the process. Turn it on only where the system has
# libhardened_malloc.so and a 48-bit address space (see the crate's docs);
# LosOS does on PCs, where it also preloads it into every process.
hardened-malloc = ["dep:mcsapi-hardened-malloc"]
