[package]
name = "derisk-settings"
description = "derisk Settings app: appearance, desktop, input, notifications, and power preferences"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
derisk-frame.workspace = true
derisk-icons.workspace = true
derisk-sys.workspace = true
# Wallpaper thumbnails, in the formats the session decodes.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
mcsapi-components.workspace = true
mcsapi-theme.workspace = true
mcsapi-ui.workspace = true
# The Sign-in page: verification codes are TOTP (HMAC-SHA1, RFC 6238), set
# up from a QR code an authenticator app scans.
hmac = "0.12"
qrcode = { version = "0.14", default-features = false }
sha1 = { version = "0.10", default-features = false }
serde_json.workspace = true
# The Users page shares first-boot setup's rules for an account, and the
# Network page its Wi-Fi thread (which the browser demo builds without).
derisk-install.workspace = true
