[package]
name = "libfacedetection-sys"
description = "Bindings, generated by bindgen, to libfacedetection's CNN face detector, built from the vendored source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The vendored C++ is Shiqi Yu's, under the 3-clause BSD licence
# (vendor/LICENSE); the bindings and build script are derisk's.
license = "BSD-3-Clause AND GPL-3.0-only"
repository.workspace = true
links = "facedetection"
build = "build.rs"

[build-dependencies]
bindgen = "0.72.1"
cc = "1.2.41"
