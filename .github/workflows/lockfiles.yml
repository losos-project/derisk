# Every Monday, the lockfiles move to what their manifests allow now, in one
# commit straight to the default branch.
#
# `update` runs `cargo update` on every Cargo.lock (which stays within the
# versions each Cargo.toml allows, and within rust-version), `npm update
# --package-lock-only` on every package-lock.json and `nix flake update`
# when there is a flake.lock.
#
# If anything changed, `update` commits the result straight to the default
# branch, with no pull request: CI's run on that commit is the check, and a
# lockfile that breaks the build shows there as any other push would. If the
# branch moved while this ran, the commit is rebased onto it first; a
# conflict leaves this week's update unpushed and the run red, and running
# it again starts afresh.
#
# The push uses LOCKFILE_UPDATE_TOKEN, a fine-grained token with Contents
# write on this repository, when there is one: GitHub starts no workflow for
# a push made with Actions' own token, so CI would not run on the update
# until the next push. Without the secret it pushes with that token all the
# same. A branch rule that refuses direct pushes to the default branch has
# to let the token's owner, or Actions, bypass it.
name: lockfiles

on:
  schedule:
    # Monday 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Only for the push without LOCKFILE_UPDATE_TOKEN.
    permissions:
      contents: write
    steps:
      # The default branch, whatever branch a run by hand was started on:
      # the commit is rebased onto it and pushed there, so a feature branch's
      # own commits must not be in it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      # Today's stable cargo resolves each lock; resolver 3 keeps every crate
      # within the workspace's rust-version, which CI builds with.
      - name: Update the lockfiles
        env:
          # gh reads mcsapi's and pm's releases with it; they are public.
          GH_TOKEN: ${{ github.token }}
        run: |
          summary=$RUNNER_TEMP/summary.md
          rustup update --no-self-update stable && rustup default stable
          # The revision of the git source REPO in Cargo.lock, under either
          # owner the repository has had.
          locked() {
            sed -nE "s|^source = \"git\\+https://github.com/[^/]+/$1(\\?[^#]*)?#([0-9a-f]{40})\"\$|\\2|p" Cargo.lock | sort -u
          }
          declare -A before
          for repo in mcsapi pm; do before[$repo]=$(locked "$repo"); done
          : > "$RUNNER_TEMP/flake"
          if [ -e flake.lock ]; then
            nix flake update 2>&1 | tee "$RUNNER_TEMP/flake"
          fi
          git ls-files ':(glob)**/Cargo.lock' | while read -r lock; do
            echo "cargo update in $(dirname "$lock")"
            cargo update --manifest-path "$(dirname "$lock")/Cargo.toml" < /dev/null
          done
          git ls-files ':(glob)**/package-lock.json' | while read -r lock; do
            echo "npm update in $(dirname "$lock")"
            (cd "$(dirname "$lock")" && npm update --package-lock-only --ignore-scripts --no-fund --no-audit < /dev/null)
          done

          # mcsapi and pm come by git, which cargo update moves to their
          # default branch. They follow their weekly releases instead, the
          # ones each cut at 02:17 UTC today (its .github/release), as the
          # OS's submodules do: every crate of the source moves to the
          # release's commit, unless the lock already held a newer one
          # someone moved it to by hand. A repository with no weekly
          # release yet stays on its default branch.
          : > "$RUNNER_TEMP/releases"
          for dep in mcsapi:mcsapi pm:pm-signing; do
            repo=${dep%%:*} crate=${dep#*:}
            tag=$(gh release list --repo "losos-project/$repo" --limit 1000 --exclude-drafts --json tagName \
              --jq '.[].tagName | select(test("^weekly-[0-9]{8}T[0-9]{4}$"))' | sort | tail -n 1)
            if [ -z "$tag" ]; then
              echo "$repo has no weekly release yet; it stays on its default branch."
              continue
            fi
            rev=$(gh api "repos/losos-project/$repo/commits/$tag" --jq .sha)
            target=$rev
            if [ -n "${before[$repo]}" ] && [ "$(gh api "repos/losos-project/$repo/compare/$rev...${before[$repo]}" --jq .status)" = ahead ]; then
              echo "$repo stays at ${before[$repo]}, ahead of $tag."
              target=${before[$repo]}
            fi
            cargo update -p "$crate" --precise "$target" < /dev/null
            if [ "$target" = "$rev" ]; then
              echo "- \`$repo\`: [\`$tag\`](https://github.com/losos-project/$repo/releases/tag/$tag)" >> "$RUNNER_TEMP/releases"
            fi
          done

          # nix prints each input as its name, the old URL and date, then
          # "→" and the new URL and date; the dates are what a reader wants.
          {
            echo "### Lockfiles"
            echo
            awk -F"'" '
              /^• Updated input/ { name = $2; from = ""; next }
              name != "" && from == "" { from = $NF; next }
              name != "" { to = $NF; gsub(/[ ()]/, "", from); gsub(/[ ()]/, "", to)
                           printf "- flake input `%s`: %s to %s\n", name, from, to; name = "" }
            ' "$RUNNER_TEMP/flake"
            git diff --numstat -- ':(glob)**/Cargo.lock' ':(glob)**/package-lock.json' |
              awk '{ printf "- `%s`: +%s -%s lines\n", $3, $1, $2 }'
            if [ -s "$RUNNER_TEMP/releases" ]; then
              echo
              echo "Git dependencies at their weekly releases:"
              echo
              cat "$RUNNER_TEMP/releases"
            fi
          } > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Push them to the default branch
        env:
          TOKEN: ${{ secrets.LOCKFILE_UPDATE_TOKEN || github.token }}
          HAS_TOKEN: ${{ secrets.LOCKFILE_UPDATE_TOKEN != '' }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          # HEAD, because a moved submodule is staged, not just changed.
          if git diff HEAD --quiet; then
            echo "Every lockfile is already current." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # No line naming the run: commits here carry no attribution, and the
          # run's own summary already lists what moved.
          git commit -qam "chore(deps): update lockfiles" -m "$(cat "$RUNNER_TEMP/summary.md")"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" fetch --quiet origin "$BASE"
          if ! git rebase --quiet "origin/$BASE"; then
            git rebase --abort
            echo "::error::$BASE changed the same lockfiles while this ran, so the update is not pushed; run the workflow again."
            exit 1
          fi
          git -c http.extraheader="$auth" push origin "HEAD:refs/heads/$BASE"
          echo "Pushed $(git rev-parse --short HEAD) to $BASE." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_TOKEN" != true ]; then
            echo "::warning::LOCKFILE_UPDATE_TOKEN is not set, so the update was pushed with Actions' own token and CI does not run on it until the next push."
          fi
