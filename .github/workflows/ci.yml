name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commits, with the tag beside each: a tag can be moved
# by whoever controls the action's repository, and these steps run with the
# checkout's token in reach.

# A newer push to a pull request cancels the run already going: the older
# commit's result no longer decides anything. Pushes to main each finish,
# since release.yml releases the ones that pass.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether the change can affect the code (.github/changes): one that only
  # edits text, screenshots or another workflow skips the jobs below, which
  # a required check reads as passed. If this job fails, they run anyway.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: .github/changes .github/workflows/ci.yml >> "$GITHUB_OUTPUT"

  check:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        features: ["", "--features derisk/host"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # wasm32-unknown-unknown: derisk-plugin's build script compiles the
      # palette's and the overview's plugins under plugins/ to WebAssembly. 1.96 is the oldest
      # rustc wasmtime 49, which runs them, builds with.
      - run: rustup toolchain install 1.96 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown && rustup default 1.96
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl-dev libgles-dev libpam0g-dev libinput-dev libudev-dev libgbm-dev libseat-dev libdrm-dev libvirt-dev libclang-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings
      # The browser demo of the core apps (scripts/build-web.sh): derisk-web
      # and everything it links, built for wasm32 as the page runs it.
      - if: matrix.features == ''
        run: cargo clippy -p derisk-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace ${{ matrix.features }}

  nix:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      # Clippy and tests for the default and host builds, rustfmt and the
      # packages; see `checks` in flake.nix.
      - run: nix flake check -L
      - name: Dev shell
        run: nix develop -i -k TERM -k HOME -c cargo --version
