name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commits, with the tag beside each: a tag can be moved
# by whoever controls the action's repository, and these steps run with the
# checkout's token in reach.

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        features: ["", "--features derisk/host"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # wasm32-unknown-unknown: derisk-plugin's build script compiles the
      # palette's and the overview's plugins under plugins/ to WebAssembly. 1.96 is the oldest
      # rustc wasmtime 49, which runs them, builds with.
      - run: rustup toolchain install 1.96 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown && rustup default 1.96
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl-dev libgles-dev libpam0g-dev libinput-dev libudev-dev libgbm-dev libseat-dev libdrm-dev libclang-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings
      # The browser demo of the core apps (scripts/build-web.sh): derisk-web
      # and everything it links, built for wasm32 as the page runs it.
      - if: matrix.features == ''
        run: cargo clippy -p derisk-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace ${{ matrix.features }}

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      # Clippy and tests for the default and host builds, rustfmt and the
      # packages; see `checks` in flake.nix.
      - run: nix flake check -L
      - name: Dev shell
        run: nix develop -i -k TERM -k HOME -c cargo --version
